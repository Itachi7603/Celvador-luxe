<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Track Order — Celvador Luxe</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --crimson: #630d16;
      --charcoal: #121214;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fcfbfa; color: var(--charcoal); font-family: var(--font-sans); }
    header { background: #ffffff; padding: 14px 18px; border-bottom: 1px solid #f0eae7; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-family: var(--font-serif); font-size: 1.15rem; color: var(--crimson); text-decoration: none; letter-spacing: 2px; }
    .track-card { max-width: 480px; margin: 30px auto; padding: 20px; background: #ffffff; border-radius: 14px; border: 1px solid #eee7e2; }
    .input-row { display: flex; gap: 8px; margin: 14px 0; }
    .input-row input { flex: 1; padding: 10px 12px; border: 1px solid #e4e4e7; border-radius: 6px; font-size: 0.8rem; outline: none; }
    .input-row button { padding: 10px 16px; background: var(--crimson); color: #fff; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .timeline { margin-top: 20px; border-left: 2px solid #e4e4e7; padding-left: 16px; display: none; }
    .t-step { margin-bottom: 16px; position: relative; font-size: 0.78rem; }
    .t-step::before { content: ""; position: absolute; left: -21px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--crimson); }
    .t-step.done { color: #059669; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" style="color: var(--crimson); text-decoration: none; font-weight: 700; font-size: 0.8rem;">&larr; Home</a>
    <a href="index.html" class="brand">Celvador Luxe</a>
    <span></span>
  </header>

  <div class="track-card">
    <h3 style="font-family: var(--font-serif); font-size: 1.3rem; color: var(--crimson);">Track Your Order</h3>
    <p style="font-size: 0.75rem; color: #71717a; margin-top: 4px;">Enter your Order ID to check live courier delivery status.</p>

    <div class="input-row">
      <input type="text" id="trackInput" placeholder="Order ID (e.g. COD-... or pay_...)">
      <button onclick="trackOrder()">Track</button>
    </div>

    <div class="timeline" id="timelineBox">
      <div class="t-step done" id="s1">✓ Order Confirmed</div>
      <div class="t-step" id="s2">Insured Velvet Box Packaging &amp; Verification</div>
      <div class="t-step" id="s3">Dispatched via Express Courier</div>
      <div class="t-step" id="s4">Doorstep Delivery (5-7 Working Days)</div>
    </div>
  </div>

  <script>
    function trackOrder() {
      var val = document.getElementById("trackInput").value.trim();
      if (!val) {
        alert("Please enter your Order ID.");
        return;
      }
      document.getElementById("timelineBox").style.display = "block";
      document.getElementById("s1").innerText = "✓ Order Found: " + val;
    }

    window.onload = function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      if (id) {
        document.getElementById("trackInput").value = id;
        trackOrder();
      }
    };
  </script>
</body>
</html>
